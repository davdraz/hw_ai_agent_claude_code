services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plantbase
    ports:
      - "5432:5432"
    volumes:
      - plantbase_pgdata:/var/lib/postgresql/data
      - ./scripts/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plantbase"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  plantbase_pgdata:
